<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Basin: live data flow</title>
<link rel="stylesheet" href="/style.css?v=__BUILD__" />
</head>
<body data-tab="flow">
<header id="topbar">
  <div class="brand">
    <span class="logo">&#9650;</span>
    <span class="brand-name">Basin</span>
    <span class="brand-sub">live data flow</span>
  </div>
  <nav id="tabs">
    <button class="tab active" data-tab="flow" type="button">FlowViz</button>
    <button class="tab" data-tab="investigations" type="button">Investigations<span id="inbox-badge" class="hidden"></span></button>
    <button class="tab" data-tab="ask" type="button">Ask</button>
  </nav>
  <div class="stats">
    <div class="stat"><span class="stat-value" id="stat-rate">0</span><span class="stat-label">events/s</span></div>
    <div class="stat"><span class="stat-value" id="stat-rows">&ndash;</span><span class="stat-label">rows (24h)</span></div>
    <div class="stat" id="stat-fresh-box" title="age of the newest row in the core tables"><span class="stat-value" id="stat-fresh">&ndash;</span><span class="stat-label">ingest freshness</span></div>
    <div class="stat" id="stat-cost-box" title="estimated daily cost"><span class="stat-value" id="stat-cost">&ndash;</span><span class="stat-label">cost/day (est)</span></div>
    <div class="stat" id="stat-byterow-box" title="stored bytes vs the same rows serialized as JSON (estimated)"><span class="stat-value" id="stat-byterow">&ndash;</span><span class="stat-label">stored vs raw</span></div>
  </div>
  <div class="header-right">
    <div class="bsky-toggle">
      <span class="toggle-label" id="bsky-state">Bluesky: paused</span>
      <label class="switch" title="Toggle the Bluesky firehose ingest">
        <input type="checkbox" id="bsky-toggle" />
        <span class="slider"></span>
      </label>
    </div>
  </div>
</header>

<main id="tab-flow" class="tab-view active">
  <div id="flow">
    <svg id="edges" aria-hidden="true"></svg>
    <div class="columns" id="columns"></div>
  </div>
</main>

<section id="tab-investigations" class="tab-view">
  <div class="inv-layout">
    <div id="inbox-list"></div>
    <div id="inbox-report" class="hidden"></div>
  </div>
</section>

<section id="tab-ask" class="tab-view">
  <div class="ask-input-row">
    <div class="seg" id="ask-mode">
      <button id="mode-ai" class="seg-btn active" type="button" title="ask a question in plain language">AI</button>
      <button id="mode-sql" class="seg-btn" type="button" title="run SQL by hand (guarded, budget-metered)">SQL</button>
    </div>
    <input id="ask-input" type="text" placeholder="ask the archive: which domains were queried most today? who's generating DNS traffic tonight?" autocomplete="off" spellcheck="false" />
    <textarea id="sql-input" class="hidden" spellcheck="false"
      placeholder="SELECT ... (read-only, forced LIMIT 200, 30s cap)"></textarea>
    <button id="ask-submit" class="btn primary" type="button">Ask</button>
    <button id="sql-run" class="btn primary hidden" type="button">Run</button>
    <span id="ask-note" class="hidden"></span>
  </div>
  <div class="ask-layout">
    <aside id="ask-rail">
      <div id="ask-session"></div>
      <div id="ask-chips"></div>
      <div id="sql-chips" class="hidden"></div>
    </aside>
    <div id="ask-workspace">
      <div id="ask-body"></div>
      <div id="sql-result" class="hidden"></div>
    </div>
  </div>
</section>

<footer id="ticker">
  <div class="ticker-handle" id="ticker-handle" title="drag to resize; double-click to expand"></div>
  <div class="ticker-title">live events</div>
  <ul id="ticker-list"></ul>
</footer>

<div id="event-modal" class="hidden">
  <div class="event-modal-box">
    <div class="console-head">
      <span class="console-title" id="event-modal-title">event detail</span>
      <button id="event-modal-close" class="btn small" type="button">close</button>
    </div>
    <div id="event-modal-body" class="event-modal-body"></div>
  </div>
</div>

<script src="/app.js?v=__BUILD__"></script>
<script src="/vendor/echarts.min.js?v=__BUILD__"></script>
<script src="/charts.js?v=__BUILD__"></script>
<script src="/ask.js?v=__BUILD__"></script>
</body>
</html>
